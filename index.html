<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>მართვის მოწმობის გამოცდა — საქართველო | სიმულატორი</title>
<meta name="description" content="უფასო სიმულატორი: მოემზადე საქართველოში მართვის მოწმობის პრაქტიკული გამოცდისთვის. რეალური მარშრუტები, ხმოვანი მითითებები, თამაში ბრაუზერში.">
<meta property="og:title" content="მართვის მოწმობის გამოცდა — საქართველო">
<meta property="og:description" content="უფასო სიმულატორი ბრაუზერში: რეალური საგამოცდო მარშრუტები.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f1c2b">
<style>
:root{--bg:#0f1c2b;--bg2:#16293d;--card:#1b3148;--line:#2b4766;--tx:#f2f6fa;--mut:#9db3c9;--acc:#ffc400;--ok:#27a050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f1c2b}
body{background:radial-gradient(1200px 600px at 50% -200px,#25466b 0,var(--bg) 70%) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Georgian",Arial,sans-serif;min-height:100vh;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}
.brand{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(255,196,0,.2)}
.lang{display:flex;gap:4px}
.lang button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
h1{font-size:clamp(28px,7vw,42px);line-height:1.15;margin:18px 0 10px}
h2{font-size:20px;margin:26px 0 12px}
p{margin:0 0 10px;color:var(--mut)}
.lead{font-size:17px;color:#cfdcea}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 28px;font-size:18px;font-weight:800;cursor:pointer;text-decoration:none;color:#fff;background:var(--ok);min-height:52px}
.btn.big{width:100%}
.btn.sec{background:transparent;border:2px solid var(--line);color:var(--tx)}
.btn.gold{background:var(--acc);color:#1a1a1a}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.cnt{margin-top:14px;text-align:center;color:var(--mut);font-size:15px}
.cnt b{color:var(--acc);font-size:22px;font-weight:900;margin-right:4px}
.steps{display:grid;gap:10px;margin-top:6px}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#1a1a1a;display:flex;align-items:center;justify-content:center}
.step div{color:#cfdcea}
.jar{margin-top:22px;background:linear-gradient(160deg,#2a2a14,#1f2b1f);border:1px solid #5b5326;border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.jar svg{flex:none}
.jar .t{flex:1;min-width:200px}
.jar h3{margin:0 0 4px;font-size:18px}
.jar p{margin:0 0 12px}
.back{background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer;padding:8px 0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.card .nm{font-size:18px;font-weight:800}
.card .sub{font-size:13px;color:var(--mut)}
.card.open{border-color:var(--acc);background:linear-gradient(160deg,#2b4a6e,#1b3148)}
.card.open .sub{color:var(--acc);font-weight:700}
.card.lock{opacity:.5;cursor:default}
.lk{position:absolute;right:12px;top:12px;font-size:16px}
.card.route{flex-direction:row;justify-content:flex-start;min-height:72px;align-items:center;gap:14px;width:100%;margin-bottom:10px;text-decoration:none;color:var(--tx)}
.route .num{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.route.open .num{background:var(--acc);color:#1a1a1a}
.route .go{margin-left:auto;font-size:22px;color:var(--acc)}
.foot{margin:34px 0 10px;text-align:center;font-size:12px;color:#6f8aa5}
.hide{display:none}
</style></head><body>
<div class="wrap">
  <div class="top"><div class="brand"><span class="dot"></span><span id="brand"></span></div>
    <div class="lang" id="lang"></div></div>

  <section id="home">
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <a class="btn big" href="#/cities" data-t="play"></a>
    <div class="cnt hide" id="cnt"><b id="cntN">0</b><span data-t="cntL"></span></div>

    <h2 data-t="howT"></h2>
    <div class="steps">
      <div class="step"><b class="n">1</b><div data-t="s1"></div></div>
      <div class="step"><b class="n">2</b><div data-t="s2"></div></div>
      <div class="step"><b class="n">3</b><div data-t="s3"></div></div>
    </div>

    <div class="jar">
      <svg width="76" height="92" viewBox="0 0 76 92" aria-hidden="true">
        <rect x="14" y="6" width="48" height="10" rx="4" fill="#c9a227"/>
        <path d="M16 16h44l5 14c3 8 5 16 5 26 0 20-8 32-32 32S6 76 6 56c0-10 2-18 5-26z" fill="#e9f0f6" fill-opacity=".14" stroke="#e9f0f6" stroke-opacity=".6" stroke-width="2.5"/>
        <circle cx="26" cy="68" r="8" fill="#ffc400"/><circle cx="44" cy="72" r="8" fill="#ffd54a"/><circle cx="36" cy="58" r="8" fill="#ffc400"/><circle cx="50" cy="60" r="7" fill="#ffd54a"/>
        <text x="36" y="63" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">₾</text>
      </svg>
      <div class="t"><h3 data-t="jarT"></h3><p data-t="jarP"></p>
        <a class="btn gold" id="donate" data-t="donate" target="_blank" rel="noopener"></a></div>
    </div>
  </section>

  <section id="cities" class="hide">
    <button class="back" data-go="#/" data-t="back"></button>
    <h1 data-t="citiesT"></h1>
    <p data-t="citiesP"></p>
    <div class="grid" id="cityGrid"></div>
  </section>

  <section id="routes" class="hide">
    <button class="back" data-go="#/cities" data-t="back"></button>
    <h1 id="rCity"></h1>
    <p id="routesP"></p>
    <div id="routeList"></div>
  </section>

  <div style="text-align:center;margin:26px 0 0"><iframe src="ad-300x250.html" width="300" height="250" scrolling="no" style="border:0;max-width:100%" title="ad"></iframe></div>
  <div style="text-align:center;margin:14px 0 0"><iframe src="ad-320x50.html" width="320" height="50" scrolling="no" style="border:0;max-width:100%" title="ad"></iframe></div>
  <div class="foot" data-t="foot"></div>
</div>

<script>
// ====== НАСТРОЙКИ ======
// Ссылка на донат (Ko-fi, Buy Me a Coffee, PayPal.me, страница банка и т.п.).
// Пока пусто — кнопка «Задонатить» будет неактивной.
var DONATE_URL = "https://egreve.bog.ge/martva";
// Адрес игры (маршрут №1)
var GAME_URL = "game/index.html";
// Счётчик запусков экзамена (Abacus, без регистрации). Замени namespace на свой уникальный, если хочешь.
var CNT_NS = "martva-ge-simulator", CNT_KEY = "starts", CNT_BASE = "https://abacus.jasoncameron.dev/";

var T={
ka:{brand:"მართვის გამოცდა",h1:"მოემზადე მართვის მოწმობის გამოცდისთვის",lead:"უფასო სიმულატორი ბრაუზერში. რეალური საგამოცდო მარშრუტი, ხმოვანი მითითებები და გამოცდის კითხვები. დარეგისტრაცია საჭირო არ არის.",play:"თამაში",cntL:"ადამიანმა უკვე დაიწყო გამოცდა",howT:"როგორ მუშაობს",
s1:"აირჩიე ქალაქი და მარშრუტი.",s2:"იმართე მანქანა ტელეფონზე ან კომპიუტერზე: საჭე, გაზი, მუხრუჭი, მიმთითებლები.",s3:"მოუსმინე მითითებებს, გაჩერდი სადაც საჭიროა და უპასუხე გამოცდის კითხვებს.",
jarT:"დაგვეხმარე პროექტის განვითარებაში",jarP:"თამაში უფასოა. თუ გინდა, დაგვეხმარე ახალი მარშრუტებისა და ქალაქების შექმნაში.",donate:"დონატი",
back:"← უკან",citiesT:"აირჩიე ქალაქი",citiesP:"ახალი ქალაქები მალე დაემატება.",routesP:"მარშრუტი 1 ღიაა, დანარჩენი მალე გაიხსნება.",
routeN:"მარშრუტი",hw:"თბილისი–რუსთავის გზატკეცილი",soon:"მალე",open:"ღიაა",nr:"8 მარშრუტი",routesPB:"სამივე მარშრუტი ღიაა.",b1:"ჭავჭავაძის, პუშკინის და აბაშიძის ქუჩები",b2:"ბულვარი და გენერალ აბაშიძის გამზირი",b3:"ქალაქის გრძელი რგოლი",foot:"სასწავლო სიმულატორი. არ ცვლის რეალურ გამოცდისთვის მომზადებას."},
ru:{brand:"Экзамен на права",h1:"Подготовься к экзамену на водительские права",lead:"Бесплатный симулятор в браузере. Настоящий экзаменационный маршрут, голосовые подсказки и вопросы экзамена. Регистрация не нужна.",play:"Играть",cntL:"раз уже начинали экзамен",howT:"Как это работает",
s1:"Выбери город и маршрут.",s2:"Управляй машиной на телефоне или компьютере: руль, газ, тормоз, поворотники.",s3:"Слушай подсказки, останавливайся где нужно и отвечай на вопросы экзамена.",
jarT:"Поддержи проект",jarP:"Игра бесплатная. Если хочешь, помоги создать новые маршруты и города.",donate:"Задонатить",
back:"← Назад",citiesT:"Выбери город",citiesP:"Новые города скоро появятся.",routesP:"Маршрут 1 открыт, остальные откроются позже.",
routeN:"Маршрут",hw:"Трасса Тбилиси–Рустави",soon:"Скоро",open:"Открыт",nr:"8 маршрутов",routesPB:"Все три маршрута открыты.",b1:"Чавчавадзе, Пушкина, Абашидзе",b2:"Бульвар и проспект Абашидзе",b3:"Длинный городской круг",foot:"Учебный симулятор. Не заменяет подготовку к настоящему экзамену."},
en:{brand:"Driving Exam",h1:"Prepare for the Georgian driving test",lead:"A free browser simulator. A real exam route, voice instructions and exam questions. No sign-up needed.",play:"Play",cntL:"exams started so far",howT:"How it works",
s1:"Pick a city and a route.",s2:"Drive on your phone or computer: wheel, gas, brake, turn signals.",s3:"Follow the voice prompts, stop where needed and answer the exam questions.",
jarT:"Support the project",jarP:"The game is free. If you like, help fund new routes and cities.",donate:"Donate",
back:"← Back",citiesT:"Choose a city",citiesP:"More cities are coming soon.",routesP:"Route 1 is open, the rest unlock later.",
routeN:"Route",hw:"Tbilisi–Rustavi highway",soon:"Soon",open:"Open",nr:"8 routes",routesPB:"All three routes are open.",b1:"Chavchavadze, Pushkin and Abashidze streets",b2:"The boulevard and Abashidze avenue",b3:"A long city loop",foot:"Training simulator. Not a substitute for real exam preparation."}
};
var CITIES=[
 {id:"rustavi",ka:"რუსთავი",ru:"Рустави",en:"Rustavi",on:1,n:8},
 {ka:"თბილისი",ru:"Тбилиси",en:"Tbilisi"},{id:"batumi",ka:"ბათუმი",ru:"Батуми",en:"Batumi",on:1,n:3},{ka:"ქუთაისი",ru:"Кутаиси",en:"Kutaisi"},
 {ka:"თელავი",ru:"Телави",en:"Telavi"},{ka:"გორი",ru:"Гори",en:"Gori"},{ka:"ზუგდიდი",ru:"Зугдиди",en:"Zugdidi"},
 {ka:"ახალციხე",ru:"Ахалцихе",en:"Akhaltsikhe"},{ka:"ფოთი",ru:"Поти",en:"Poti"},{ka:"ოზურგეთი",ru:"Озургети",en:"Ozurgeti"},{ka:"მარნეული",ru:"Марнеули",en:"Marneuli"}
];
var lang="ka";try{lang=localStorage.getItem("lang")||(/^ru/i.test(navigator.language)?"ru":/^ka/i.test(navigator.language)?"ka":"en")}catch(e){}
function $(s){return document.querySelector(s)}

// ====== СЧЁТЧИК ======
function showCount(v){
  if(typeof v!=="number"||!isFinite(v))return;
  $("#cntN").textContent=v.toLocaleString(lang=="ru"?"ru-RU":lang=="ka"?"ka-GE":"en-US");
  $("#cnt").classList.remove("hide");
}
function loadCount(){
  try{fetch(CNT_BASE+"get/"+CNT_NS+"/"+CNT_KEY).then(function(r){return r.ok?r.json():(r.status==404?{value:0}:null)}).then(function(j){if(j)showCount(j.value)}).catch(function(){})}catch(e){}
}
// вызывается при нажатии на маршрут; не чаще раза в 30 секунд с одного устройства
function hitStart(){
  try{
    var now=Date.now(),last=+localStorage.getItem("lastHit")||0;
    if(now-last<30000)return;
    localStorage.setItem("lastHit",String(now));
  }catch(e){}
  try{fetch(CNT_BASE+"hit/"+CNT_NS+"/"+CNT_KEY,{keepalive:true}).catch(function(){})}catch(e){}
}

function render(){
  var t=T[lang];document.documentElement.lang=lang;
  $("#brand").textContent=t.brand;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t[e.dataset.t]});
  $("#lang").innerHTML=["ka","ru","en"].map(function(l){return '<button data-l="'+l+'" class="'+(l==lang?"on":"")+'">'+l.toUpperCase()+'</button>'}).join("");
  var d=$("#donate");if(DONATE_URL){d.href=DONATE_URL;d.removeAttribute("aria-disabled")}else{d.removeAttribute("href");d.setAttribute("aria-disabled","true")}
  $("#cityGrid").innerHTML=CITIES.map(function(c){
    return c.on?'<button class="card open" data-go="#/routes/'+c.id+'"><span class="nm">'+c[lang]+'</span><span class="sub">'+t.nr.replace('8',c.n)+'</span></button>'
    :'<div class="card lock"><span class="lk">🔒</span><span class="nm">'+c[lang]+'</span><span class="sub">'+t.soon+'</span></div>'}).join("");
  renderRoutes();
}

function curCity(){var m=(location.hash||"").match(/#\/routes\/(\w+)/),id=m?m[1]:"rustavi";return CITIES.filter(function(c){return c.id==id})[0]||CITIES[0]}
function renderRoutes(){
  var t=T[lang],c=curCity(),h="",bat=c.id=="batumi";
  $("#rCity").textContent=c[lang];$("#routesP").textContent=bat?t.routesPB:t.routesP;
  for(var i=1;i<=c.n;i++){
    var open=bat||i==1,url=bat?GAME_URL+"?r=bat"+i+"#r=bat"+i:GAME_URL+"?r=rustavi#r=rustavi",sub=bat?t["b"+i]:t.hw;
    h+=open?'<a class="card open route" onclick="hitStart();try{localStorage.setItem(\'route\',\''+(bat?'bat'+i:'rustavi')+'\')}catch(e){}" href="'+url+'"><span class="num">'+i+'</span><span><span class="nm">'+t.routeN+' '+i+'</span><br><span class="sub">'+sub+'</span></span><span class="go">\u25b6</span></a>'
    :'<div class="card lock route"><span class="num">'+i+'</span><span><span class="nm">'+t.routeN+' '+i+'</span><br><span class="sub">'+t.soon+'</span></span><span class="go">\ud83d\udd12</span></div>'}
  $("#routeList").innerHTML=h;
}
function show(){
  var h=location.hash||"#/";var id="home";
  if(h.indexOf("#/cities")==0)id="cities";else if(h.indexOf("#/routes")==0)id="routes";
  ["home","cities","routes"].forEach(function(s){$("#"+s).classList.toggle("hide",s!=id)});
  if(id=="routes")renderRoutes();
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var l=e.target.closest("[data-l]");if(l){lang=l.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}render();return}
  var g=e.target.closest("[data-go]");if(g){location.hash=g.dataset.go}
});
window.addEventListener("hashchange",show);
render();show();loadCount();
</script>
<!-- Adsterra: Social Bar + Popunder (только в лобби, в игре во время вождения рекламы нет) -->
<script>
(function(){
  function addScript(u){var s=document.createElement("script");s.async=true;s.setAttribute("data-cfasync","false");s.src=u;document.body.appendChild(s)}
  // Social Bar: один раз при открытии лобби
  addScript("https://bauval.org/14/c2214d531585fa6255cccc8f7ef95339");
  // Popunder: подключается, когда открыт список маршрутов, чтобы сработать при нажатии на маршрут.
  // Не чаще раза в 5 минут с одного устройства.
  var popDone=false,POP_GAP=5*60*1000;
  function loadPop(){
    if(popDone)return;
    try{var last=+localStorage.getItem("popAt")||0;if(Date.now()-last<POP_GAP)return;localStorage.setItem("popAt",String(Date.now()))}catch(e){}
    popDone=true;
    addScript("https://abscloud.org/1/0249190d6771b863e9202afc8380f68e");
  }
  function check(){if((location.hash||"").indexOf("#/routes")==0)loadPop()}
  window.addEventListener("hashchange",check);check();
})();
</script>
</body></html>
